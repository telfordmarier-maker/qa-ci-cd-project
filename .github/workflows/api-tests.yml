name: API Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: |
          npm install
          npm install -g newman
          npm install -g newman-reporter-html

      - name: Vérifier les fichiers
        run: |
          echo "Répertoire courant :"
          pwd

          echo "Contenu du projet :"
          ls -la

          echo "Contenu du dossier api-tests :"
          ls -la api-tests

          echo "Contenu du dossier collections :"
          ls -la api-tests/collections

          echo "Vérification de la collection :"
          test -f api-tests/collections/jsonplaceholder-api-tests.postman_collection.json \
          && echo "Collection trouvée" \
          || echo "Collection introuvable"

          echo "Contenu du package.json :"
          cat package.json

      - name: Exécuter les tests API
        run: npm run test:api

      - name: Publier le rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: api-tests/reports/newman-report.html